<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTI Main and North: Desktop and Mobile Preview</title>
<style>
  :root { --burgundy:#581c35; --dark:#3d1426; --peach:#f5c6ad; --soft:#fbe5d9; --ivory:#fff8f2; --ink:#252126; --line:#ebd9ce; --mute:#6b6067; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ivory); color:var(--ink); font:16px/1.6 Inter, system-ui, sans-serif; }
  header.top { background:var(--dark); color:var(--ivory); padding:20px clamp(16px,4vw,48px); }
  header.top h1 { margin:0; font:400 clamp(1.4rem,3vw,2rem)/1.2 Georgia, serif; }
  header.top p { margin:4px 0 0; color:#dcc5ba; font-size:.9rem; }
  .bar { position:sticky; top:0; z-index:5; background:rgba(255,248,242,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px clamp(16px,4vw,48px); display:flex; flex-wrap:wrap; gap:12px 28px; }
  fieldset { border:0; margin:0; padding:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  legend { float:left; margin-right:8px; padding:0; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); }
  button.opt { min-height:44px; padding:0 16px; border-radius:999px; border:1px solid #dcc3b5; background:transparent; color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer; }
  button.opt:hover:not(:disabled):not([aria-pressed="true"]) { background:var(--soft); }
  button.opt[aria-pressed="true"] { background:var(--burgundy); border-color:var(--burgundy); color:var(--ivory); }
  button.opt:disabled { opacity:.4; cursor:not-allowed; }
  button.opt:focus-visible, a:focus-visible { outline:2px solid #852338; outline-offset:3px; }
  main { padding:24px clamp(16px,4vw,48px) 64px; }
  .grid { display:grid; gap:28px; grid-template-columns:1fr; }
  .grid.two { grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
  figure { margin:0; }
  .meta { margin-bottom:10px; display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; font-size:.88rem; }
  .meta h2 { margin:0; font:400 1.25rem/1.2 Georgia, serif; }
  .meta a { color:var(--burgundy); }
  .meta span { color:var(--mute); }
  .frame { border:1px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; box-shadow:0 1px 2px rgba(61,20,38,.05), 0 12px 32px rgba(61,20,38,.08); }
  .frame.mobile { max-width:390px; margin-inline:auto; border-radius:28px; border:8px solid var(--dark); }
  .frame img, .frame iframe { display:block; width:100%; height:auto; border:0; }
  .scroll { max-height:80vh; overflow:auto; }
  .live { position:relative; width:100%; }
  .live iframe { position:absolute; inset:0 auto auto 0; transform-origin:0 0; }
  .note { margin:10px 0 0; font-size:.85rem; color:var(--mute); }
  .empty { padding:40px 20px; text-align:center; color:var(--mute); }
  footer { padding:0 clamp(16px,4vw,48px) 48px; color:var(--mute); font-size:.85rem; }
</style>
</head>
<body>
<header class="top">
  <h1>GTI Main and GTI North</h1>
  <p>Actual browser captures of the two live sites. Captured with Playwright, unmodified. <span id="when"></span></p>
</header>
<div class="bar" role="toolbar" aria-label="Preview controls">
  <fieldset><legend>Site</legend>
    <button class="opt" data-group="site" data-value="main" aria-pressed="true">GTI Main</button>
    <button class="opt" data-group="site" data-value="north" aria-pressed="false">GTI North</button>
    <button class="opt" data-group="site" data-value="compare" aria-pressed="false">Compare</button>
  </fieldset>
  <fieldset><legend>Device</legend>
    <button class="opt" data-group="device" data-value="desktop" aria-pressed="true">Desktop 1440 × 900</button>
    <button class="opt" data-group="device" data-value="mobile" aria-pressed="false">Mobile 390 × 844</button>
  </fieldset>
  <fieldset><legend>View</legend>
    <button class="opt" data-group="view" data-value="viewport" aria-pressed="true">First screen</button>
    <button class="opt" data-group="view" data-value="full-page" aria-pressed="false">Full page</button>
    <button class="opt" data-group="view" data-value="navigation" aria-pressed="false">Mobile menu</button>
    <button class="opt" data-group="view" data-value="newsletter-popup" aria-pressed="false">Newsletter popup</button>
    <button class="opt" data-group="view" data-value="live" aria-pressed="false">Live iframe</button>
  </fieldset>
</div>
<main id="stage" aria-live="polite"></main>
<footer>These are screenshots of third-party live pages for design review. Nothing here modifies either website.</footer>
<script>
const SITES = { main: { name: 'GTI Main', url: 'https://goalietraininginstitute.ca/' }, north: { name: 'GTI North', url: 'https://north.goalietraininginstitute.ca/' } }
const DEVICES = { desktop: { w: 1440, h: 900 }, mobile: { w: 390, h: 844 } }
const state = { site: 'main', device: 'desktop', view: 'viewport' }
let report = null

const fileFor = (site, device, view) => {
  if (view === 'navigation') return device === 'mobile' ? `${site}/mobile-navigation.png` : null
  if (view === 'live') return null
  return `${site}/${device}-${view}.png`
}

function card(site) {
  const { name, url } = SITES[site]
  const d = DEVICES[state.device]
  const fig = document.createElement('figure')
  const meta = document.createElement('div')
  meta.className = 'meta'
  meta.innerHTML = `<h2>${name}</h2><a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a><span>${d.w} × ${d.h} viewport</span>`
  fig.append(meta)
  const frame = document.createElement('div')
  frame.className = 'frame' + (state.device === 'mobile' ? ' mobile' : '')

  if (state.view === 'live') {
    const blocked = report?.results?.find((r) => r.key === site)?.embedHeaders?.iframeBlocked
    if (blocked) {
      frame.innerHTML = '<p class="empty">This site blocks embedding in an iframe, so only screenshots are available.</p>'
    } else {
      const box = document.createElement('div')
      box.className = 'live'
      const f = document.createElement('iframe')
      f.src = url
      f.title = `${name} live preview, ${d.w} by ${d.h}`
      f.loading = 'lazy'
      f.width = d.w
      f.height = d.h
      f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups')
      box.append(f)
      frame.append(box)
      f.style.width = d.w + 'px'; f.style.height = d.h + 'px'
      const fit = () => { const s = box.clientWidth / d.w; f.style.transform = `scale(${s})`; box.style.height = d.h * s + 'px' }
      new ResizeObserver(fit).observe(box)
      requestAnimationFrame(fit)
      const note = document.createElement('p'); note.className = 'note'
      note.textContent = 'Live embed. If it shows a blank page or a human-verification page, the site may restrict embedded or automated visits; use the screenshots instead.'
      fig.append(frame, note); return fig
    }
  } else {
    const file = fileFor(site, state.device, state.view)
    if (!file) {
      frame.innerHTML = '<p class="empty">Not available for this combination. The mobile menu only exists in the mobile layout.</p>'
    } else {
      const img = document.createElement('img')
      img.src = file
      img.alt = `${name} ${state.device} ${state.view.replace('-', ' ')} screenshot`
      img.width = d.w
      img.addEventListener('error', () => { frame.innerHTML = '<p class="empty">No screenshot was captured for this view. See capture-report.json.</p>' })
      if (state.view === 'full-page') { const s = document.createElement('div'); s.className = 'scroll'; s.append(img); frame.append(s) }
      else frame.append(img)
      img.addEventListener('load', () => { const n = document.createElement('p'); n.className = 'note'; n.textContent = `${img.naturalWidth} × ${img.naturalHeight} px screenshot`; fig.append(n) })
    }
  }
  fig.insertBefore(frame, null)
  return fig
}

function render() {
  const stage = document.getElementById('stage')
  stage.replaceChildren()
  const sites = state.site === 'compare' ? ['main', 'north'] : [state.site]
  const grid = document.createElement('div')
  grid.className = 'grid' + (sites.length > 1 ? ' two' : '')
  sites.forEach((s) => grid.append(card(s)))
  stage.append(grid)
  document.querySelectorAll('button.opt').forEach((b) => {
    b.setAttribute('aria-pressed', String(state[b.dataset.group] === b.dataset.value))
    if (b.dataset.group === 'view' && b.dataset.value === 'navigation') b.disabled = state.device !== 'mobile'
  })
  if (state.view === 'navigation' && state.device !== 'mobile') { state.view = 'viewport'; render() }
}

document.querySelectorAll('button.opt').forEach((b) => b.addEventListener('click', () => { state[b.dataset.group] = b.dataset.value; render() }))
fetch('capture-report.json').then((r) => r.json()).then((r) => { report = r; document.getElementById('when').textContent = 'Captured ' + new Date(r.capturedAt).toLocaleString() + '.'; render() }).catch(() => render())
render()
</script>
</body>
</html>

about:
  eyebrow: "About"
  title: "Practical engineering, grounded in the business need"
  lede: "I'm Ibrahem Sotejo, a Solutions Architect and full-stack developer from the Philippines."
  paragraphs:
    - "I enjoy turning complex requirements into practical digital solutions, combining architecture, software engineering, integrations, and a solution-driven mindset to build systems that work for people and businesses."

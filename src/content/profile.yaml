    - "I value practical engineering decisions: the right solution should address the business need, fit the technical environment, and remain understandable and maintainable over time."
  strengths:
    - title: "Architecture"
      text: "Translating requirements into practical systems, integration patterns, technical direction, and architecture documentation."
    - title: "Engineering"
      text: "Delivering and modernizing applications, APIs, frontend platforms, integrations, and digital products."
    - title: "Delivery and leadership"
      text: "Improving engineering quality, guiding developers, reviewing code, and supporting reliable delivery."
  attributes:
    - "Solution-driven"
    - "Curious about technology"
    - "Business-aware"
    - "Collaborative"


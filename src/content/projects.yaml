    caseStudy:
      slug: "nutridense-inventory"
      seoTitle: "Nutridense Inventory System: Laravel inventory case study | Ibrahem Sotejo"
      seoDescription: "A review of a legacy Laravel and React inventory system for a snack factory: how it is built, what holds up, what I would fix and how I would modernise it."
      keywords: ["Laravel inventory system", "Laravel case study", "inventory management", "production and stock control", "Laratrust roles", "legacy code review", "Laravel modernisation"]
      ogImage:
        src: "/images/projects/og-nutridense-inventory.jpg"
        alt: "Nutridense Inventory System case study: the Productions list from a Laravel inventory application, with demo data."
        width: 1200
        height: 630
      published: "2026-11-17"
      modified: "2026-11-17"
      headline: "Nutridense Inventory System, reviewed"
      lede: "A legacy Laravel application that tracks raw materials, finished goods and production for a snack factory. This page explains how it is built, then gives a plain review of what holds up and what I would change today."
      snapshot:
        - { label: "Type", value: "Inventory control web application" }
        - { label: "Stack", value: "Laravel 10, PHP 8.1+, Blade with React 18 components, MySQL or MariaDB" }
        - { label: "Access", value: "Role-based: superadministrator, administrator and user" }
        - { label: "Size", value: "16 admin controllers, 24 migrations, six Excel report exports" }
        - { label: "Status", value: "Legacy codebase, no live demo" }
      architecture:
        - title: "Domain modules instead of a flat app folder"
          text: "Business code lives in app/Inventory, split by domain: productions, inventories, products, materials, purchase orders, customers, employees and options. Controllers depend on repository interfaces rather than on Eloquent models directly."
        - title: "Inventory as a ledger"
          text: "Stock is not a single editable number. A production run, for example, writes inventory entries tagged with the run's id and a process type, so the daily report can show begin balance, received, release, spillage, production and end-of-day figures, with day and night shifts kept apart."
        - title: "Roles enforced at the route"
          text: "Laratrust roles gate the routes. Master data such as suppliers, materials and products is for superadministrators, day-to-day receiving, releasing and production is open to all three roles, and reports are for administrators and above."
        - title: "React only where the form needs it"
          text: "Pages are server-rendered Blade. The production form is a React component that asks two JSON endpoints for the finished goods and the materials each one consumes, then lets the user build the run."
        - title: "Reports exported to Excel"
          text: "Daily inventory, critical stocks, near-expiring materials and products, and received and released items each have an export class built on Laravel Excel."
      interfaces:
        - name: "GET /api/productions/products"
          text: "Lists the finished goods that can be produced."
        - name: "GET /api/productions/materials/{id}"
          text: "Returns the materials a given product consumes, used by the production form."
      strengths:
        - title: "Stock is checked before a run is saved"
          text: "A validation step collects every material that would run short and blocks the production with a message naming them, so stock cannot silently go negative."
        - title: "Draft and active runs"
          text: "A run can be saved as a draft. Only when it is active are materials deducted and the finished goods added to inventory, which matches how a factory floor plans before it commits."
        - title: "Clear module boundaries"
          text: "Repository interfaces and per-domain folders make it easy to find where a rule lives and to swap or test a piece in isolation."
        - title: "Reports shaped like the operation"
          text: "Shift columns, near-expiry lists and critical-stock levels reflect questions a food manufacturer actually asks every day."
      concerns:
        - title: "No database transactions"
          text: "Saving a production writes the run, its lines, the material deductions and the finished-goods entry as separate statements, and no transaction is used anywhere in the app code. A failure halfway leaves stock inconsistent."
        - title: "A race between the check and the deduction"
          text: "Stock is validated first and deducted afterwards, without a lock. Two runs submitted at the same moment can both pass the check against the same stock."
        - title: "Business rules in fat controllers"
          text: "The production controller is about 370 lines and holds validation, stock arithmetic and persistence calls. The repository layer exists, but the rules themselves sit in controller methods."
        - title: "Unauthenticated lookup API"
          text: "The two /api/productions routes have no authentication middleware, so product and bill-of-materials data is readable by anyone who can reach the server."
        - title: "Rule changes recorded as comments"
          text: "The material-deduction call is wrapped in comments noting it was removed after one meeting and put back after another. The decision history belongs in a test or a setting, not in a comment."
        - title: "Almost no automated tests"
          text: "The test folder contains only Laravel's two example tests, so none of the stock rules are protected against regressions."
        - title: "Housekeeping debt"
          text: "Resource routes for receiving, releasing and productions are registered twice under different role groups, a routes backup file is still in the repository, and several class names and the footer app name are misspelled."
        - title: "Framework age"
          text: "Laravel 10 no longer receives security fixes, and the project mixes Laravel UI, Blade and a separate React build."
      modernisation:
        - title: "Tests and transactions first"
          text: "Write feature tests for production, receiving and releasing, then wrap each stock-changing flow in a database transaction. These flows hold the money-and-stock logic, so they get protection before any refactor."
        - title: "Lock the stock being consumed"
          text: "Re-check and deduct inside the transaction with row locks, so concurrent runs cannot overdraw a material."
        - title: "Extract action classes"
          text: "Move the stock check, deduction and inventory writes into named actions such as ProduceFinishedGoods. Controllers then validate and delegate."
        - title: "Protect and shape the API"
          text: "Put the lookup endpoints behind Sanctum or session auth and return API resources instead of raw rows."
        - title: "Upgrade in steps"
          text: "Move to a supported Laravel release one major version at a time, with the new tests as the safety net, and decide whether Laratrust still fits or policies are simpler."
      verdict: "A sensible domain-oriented design with the right business rules in the right places. It is held back by missing transactions, missing tests and an open API, which makes it a candidate for incremental hardening rather than a rewrite."


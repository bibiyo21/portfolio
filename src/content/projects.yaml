  - id: gti-north
    scene: "gti-north"
    theme: north
    name: "GTI North"
    siteLabel: "Location implementation"
    category: "Web Platforms"
    summary: "A location-specific GTI implementation that reuses the shared platform approach."
    overview: "GTI North is a location-specific implementation of the GTI platform. The work explores how a WordPress multisite setup can serve a location with its own content and rules while reusing a common codebase."
    context: "A multi-location organization wants each location to feel local while avoiding a separate codebase, plugin set and user base to maintain for every site."
    role:
      - "Worked on WordPress multisite architecture."
      - "Worked on location-sensitive behaviour."
      - "Contributed to deployment."
    approach:
      - title: "WordPress multisite and domain mapping"
        text: "A multisite network with domain mapping for location sites."
        status: proposed
      - title: "Shared codebase and plugins"
        text: "One common codebase and centrally managed plugins reused across sites."
        status: proposed
      - title: "Centralized users"
        text: "A single user strategy across the network."
        status: proposed
      - title: "Site cloning and replication"
        text: "A repeatable way to create a new location site from an existing one."
        status: proposed
      - title: "Location-sensitive rules"
        text: "Content and behaviour that change by location."
        status: proposed
      - title: "Separate site data and deployment"
        text: "Per-site data kept separate, with deployment and environment considerations."
        status: proposed
    technologies: ["WordPress", "WooCommerce", "PHP", "MySQL"]
    challenges:
      - title: "Shared code, separate data"
        text: "Reusing code and plugins across locations while keeping each site's data separate."
      - title: "Location-sensitive behaviour"
        text: "Keeping location-specific rules from leaking into shared code."

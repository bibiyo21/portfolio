# Featured work. Only supplied projects are listed. Add more by appending to `items`.
# Statuses: implemented | in-progress | proposed | planned. They describe the architecture/approach items only.
# Architecture details below are kept as `proposed` (designed) until the owner confirms what was delivered.
# `outcome` is shown only when the owner supplies verified results. `liveUrl` is shown only for URLs the owner supplied.
# `preview` holds real screenshots of the live site (see `npm run capture:gti` and `node scripts/optimize-gti-images.mjs`).

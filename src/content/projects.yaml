    caseStudy:
      slug: "sconnect-integration"
      seoTitle: "Samsung S Connect Integration: Laravel API integration case study | Ibrahem Sotejo"
      seoDescription: "A review of a legacy Laravel dashboard that integrates with the Samsung S Connect API and exposes its own Sanctum-secured API: design, strengths, risks and a modernisation path."
      keywords: ["Samsung API integration", "Laravel Sanctum", "Laravel API", "purchase order integration", "REST API token authentication", "legacy code review", "Laravel modernisation"]
      ogImage:
        src: "/images/projects/og-sconnect-integration.jpg"
        alt: "Samsung S Connect Integration case study: the purchase order list from a Laravel integration dashboard, with demo data."
        width: 1200
        height: 630
      published: "2026-11-17"
      modified: "2026-11-17"
      headline: "Samsung S Connect Integration, reviewed"
      lede: "A legacy Laravel back-office dashboard that connects a retailer's order handling to the Samsung S Connect API, and exposes an API of its own, secured with Sanctum, for receiving purchase orders. This page explains the design, then reviews it honestly."
      snapshot:
        - { label: "Type", value: "Integration dashboard and REST API" }
        - { label: "Stack", value: "Laravel 8, PHP 7.3 or 8, Jetstream, Sanctum, Blade with Tailwind CSS, MySQL or PostgreSQL" }
        - { label: "Outbound", value: "Samsung S Connect API: purchase-order status, product catalogue and IMEI returns" }
        - { label: "Inbound", value: "Sanctum bearer-token API for creating purchase orders" }
        - { label: "Size", value: "7 controllers, 4 form requests, 21 migrations, built in 2022" }
        - { label: "Status", value: "Legacy codebase, no live demo" }
      architecture:
        - title: "Two directions in one application"
          text: "Staff use the dashboard, which calls the Samsung API. Other systems call this app's own API, which creates purchase orders. The two sides use different authentication."
        - title: "A local mirror of partner data"
          text: "Purchase orders, items, catalogue entries and IMEI returns are stored locally with an update-by audit column on every table. Lists, search and Excel export read the local database, so they work whether or not the partner API is reachable."
        - title: "Write-through to the partner"
          text: "Editing a purchase order sends its status, remarks and invoice lines to Samsung first. The local record is updated only when that call succeeds, and failures return to the form with the partner's error messages."
        - title: "Partner session held in the user's session"
          text: "A middleware on the write routes signs in to the partner API and keeps the returned token in the user's session. The catalogue and IMEI return forms reuse it for their own calls."
        - title: "Two kinds of login"
          text: "Staff sign in through Jetstream with sessions. Machine callers exchange credentials for a Sanctum bearer token and send it on every request."
        - title: "One codebase, two database engines"
          text: "The purchase-order list switches its SQL by the configured connection, so the same code runs on MySQL locally and PostgreSQL on a Heroku-style host."
      interfaces:
        - name: "POST /api/login"
          text: "Exchanges a user id and password for a Sanctum bearer token."
        - name: "POST /api/request"
          text: "Protected by auth:sanctum. Receives a purchase order with its items and creates or updates the order by PO number."
        - name: "GET /api/user"
          text: "Protected by auth:sanctum. Returns the authenticated user, useful to check a token."
        - name: "Outbound: Samsung S Connect"
          text: "Three partner interfaces called with a bearer token: purchase-order status updates, product catalogue entries and IMEI returns."
      strengths:
        - title: "Write-through keeps local state honest"
          text: "Because the partner is called before the local save, the dashboard never shows a status Samsung rejected."
        - title: "Clean split between staff and machine access"
          text: "Sessions for people, bearer tokens for systems, each on its own routes, so one cannot be mistaken for the other."
        - title: "Validation at the edges"
          text: "Form requests guard the purchase-order create and update, the catalogue and the IMEI return paths."
        - title: "Audit trail by default"
          text: "Every business table records who last changed a row, which is what a support team asks first when a number looks wrong."
        - title: "Useful even when the partner is down"
          text: "Reads, search and export never depend on the partner API."
      concerns:
        - title: "Re-sending an order duplicates its lines"
          text: "The order intake upserts the header by PO number but creates item rows every time, so posting the same order twice doubles its items. Header and items are not wrapped in a transaction either, so a failure leaves a partial order."
        - title: "Partner sign-in on every write"
          text: "The check that would reuse the stored token is commented out, so every write signs in again. A failed sign-in is not caught and surfaces as an error page."
        - title: "Push then save, with nothing to reconcile"
          text: "If Samsung accepts an update and the local save then fails, the two systems disagree and nothing records that."
        - title: "Tokens that never expire"
          text: "Sanctum expiration is not set and tokens are issued with full abilities, so a leaked token stays valid and unrestricted."
        - title: "Raw SQL with a broken variant"
          text: "The purchase-order list builds raw aggregate SQL. The PostgreSQL variant wraps column names in lower() as quoted strings, so it would aggregate text rather than the columns."
        - title: "Schema and code drift"
          text: "A migration renames modelCode to model_code, but most of the code still reads modelCode, so the full migration set breaks the screens until the name is reconciled."
        - title: "Loops that query"
          text: "Updating a purchase order looks each item up by id inside a loop with no check that it exists, and the keyword search uses leading-wildcard LIKE across eight columns."
        - title: "Only the framework's default tests"
          text: "The test folder covers Jetstream's own features. Nothing exercises purchase orders, the API or the partner calls."
        - title: "Framework age"
          text: "Laravel 8 reached the end of security support some time ago."
      modernisation:
        - title: "A dedicated partner client"
          text: "Move every Samsung call into one service class: configuration in config/services.php, the token cached until it expires, one retry on a 401, timeouts, typed errors and a log line per request."
        - title: "Idempotent order intake"
          text: "Give each order line a natural key, upsert inside a transaction and return a consistent response when the same order arrives twice."
        - title: "Queue the outbound push"
          text: "Record the intended update in an outbox table and send it from a queued job with retries, so a partner outage or a local failure leaves a visible, replayable state."
        - title: "Harden Sanctum"
          text: "Issue tokens with specific abilities such as orders:create, set an expiry, and rate-limit the login route."
        - title: "Replace raw SQL and settle the schema"
          text: "Use Eloquent relationships and scopes for the list, add indexes for the searched columns and pick one column name."
        - title: "Contract tests, then upgrade"
          text: "Cover each partner interface with Http::fake tests and the API with feature tests, then upgrade Laravel one major version at a time."
      verdict: "The shape is right: a local mirror, write-through to the partner and a separate token-secured API. The integration layer needs idempotency, token caching and tests before I would trust it with unattended traffic."

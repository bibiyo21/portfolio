# Parallel GitLab CI/CD implementation. GitHub Actions is the primary deployment owner.
# Protected CI/CD variables required for deploys: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

stages:
  - validate
  - build
  - unit-test
  - e2e-test
  - deploy

default:
  image: node:22-bookworm
  interruptible: true

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.64.1-noble"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.install: &install
  - npm ci --prefer-offline

validate:content:
  stage: validate
  script:
    - *install
    - npm run content:validate

validate:types:
  stage: validate
  script:
    - *install
    - npm run typecheck

build:
  stage: build
  needs: ["validate:content", "validate:types"]
  script:
    - *install
    - npm run build
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week

unit-test:
  stage: unit-test
  needs: ["build"]
  variables:
    CI: "true"
  script:
    - *install
    - npm run test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - coverage/
    reports:
      junit: test-results/junit.xml

e2e-test:
  stage: e2e-test
  needs: ["build"]
  image: $PLAYWRIGHT_IMAGE
  variables:
    CI: "true"
    E2E_PREVIEW: "1"
  script:
    - *install
    - npm run test:e2e
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - playwright-report/
      - test-results/

.deploy-base:
  stage: deploy
  needs: ["build", "unit-test", "e2e-test"]
  interruptible: false
  before_script:
    - *install

deploy:preview:
  extends: .deploy-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $VERCEL_TOKEN
  environment:
    name: preview/$CI_MERGE_REQUEST_IID
  script:
    - npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
    - npx vercel build --token="$VERCEL_TOKEN"
    - npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"

deploy:production:
  extends: .deploy-base
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $VERCEL_TOKEN
      when: manual
  allow_failure: false
  environment:
    name: production
  script:
    - npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - npx vercel build --prod --token="$VERCEL_TOKEN"
    - npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
